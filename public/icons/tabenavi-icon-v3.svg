<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="plate" x1="140" y1="140" x2="372" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>

  <!-- Plate (circle) -->
  <circle cx="256" cy="264" r="136" fill="url(#plate)" opacity="0.95"/>
  <circle cx="256" cy="264" r="108" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>

  <!-- Fork (left) -->
  <g transform="translate(196, 230)" stroke="white" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="0" y2="-40"/>
    <line x1="16" y1="0" x2="16" y2="-40"/>
    <line x1="32" y1="0" x2="32" y2="-40"/>
    <path d="M-4,0 Q-4,16 16,16 Q36,16 36,0"/>
    <line x1="16" y1="16" x2="16" y2="80"/>
  </g>

  <!-- Knife (right) -->
  <g transform="translate(292, 150)" stroke="white" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M0,0 Q20,20 20,50 L20,80"/>
    <line x1="20" y1="80" x2="20" y2="160"/>
  </g>

  <!-- "T" letter accent (たべなびの T) -->
  <g transform="translate(256, 276)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#0ea5e9" text-anchor="middle" dominant-baseline="central" opacity="0.6">T</text>
  </g>

  <!-- Compass needle (navi) at top right -->
  <g transform="translate(396, 116)">
    <circle r="24" fill="white" opacity="0.9"/>
    <path d="M0,-14 L5,6 L0,2 L-5,6 Z" fill="#0ea5e9"/>
    <path d="M0,14 L5,-6 L0,-2 L-5,-6 Z" fill="#0ea5e9" opacity="0.4"/>
  </g>
</svg>
